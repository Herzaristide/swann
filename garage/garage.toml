# Garage, un seul nœud (docker-compose.yml). Le secret RPC vient de
# GARAGE_RPC_SECRET ; la clé et le bucket par défaut de GARAGE_DEFAULT_*.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Région par défaut des clients S3 (minio-py signe en us-east-1).
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"
