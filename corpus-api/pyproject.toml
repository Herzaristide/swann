[project]
name = "swann-api"
version = "0.1.0"
description = "Corpus API de Swann : accès en lecture au corpus (catalogue, texte, recherche, alignements)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.9",
    "swann-core",
    "python-multipart>=0.0.20",
]

[project.scripts]
swann-api = "swann_api.main:run"

[tool.uv.sources]
swann-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swann_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
