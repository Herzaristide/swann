[project]
name = "swann-core"
version = "0.1.0"
description = "Swann : encodeurs, Qdrant et stockage S3 partagés par l'ingestion et l'API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "torch>=2.6",
    "transformers>=4.51",
    "sentence-transformers>=6.0",
    "snowballstemmer>=2.2",
    "qdrant-client>=1.13",
    "minio>=7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swann_core"]
