services:
  postgres:
    image: postgres:17-alpine
    container_name: swann_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swann}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swann}
      POSTGRES_DB: ${POSTGRES_DB:-swann}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swann} -d ${POSTGRES_DB:-swann}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applique les migrations de db/migrations/ (dbmate) puis s'arrête.
  # Les autres services qui écrivent en base attendent sa fin.
  migrate:
    image: ghcr.io/amacneil/dbmate:2.35.1
    container_name: swann_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-swann}:${POSTGRES_PASSWORD:-swann}@postgres:5432/${POSTGRES_DB:-swann}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    command: ["--wait", "up"]
    volumes:
      - ./db/migrations:/db/migrations:ro
    restart: "no"

  # Crée les bases des autres services sur le même serveur Postgres, puis
  # s'arrête (idempotent ; initdb.d ne tourne que sur un volume vide) :
  #   keycloak : comptes, sessions, realm `swann`
  #   reader   : données des lecteurs de la liseuse (préférences, progression…)
  databases:
    image: postgres:17-alpine
    container_name: swann_databases
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-swann}
      PGPASSWORD: ${POSTGRES_PASSWORD:-swann}
      PGDATABASE: ${POSTGRES_DB:-swann}
    command:
      - sh
      - -c
      - |
        for db in keycloak reader console; do
          psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$$db'" | grep -q 1 \
            || psql -c "CREATE DATABASE $$db"
        done
    restart: "no"

  # Identité (OIDC). Realm `swann` importé au premier démarrage depuis
  # keycloak/import/ (ignoré ensuite s'il existe déjà).
  #   console : http://localhost:8080/admin  (KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD)
  # Les jetons portent toujours l'émetteur public (KEYCLOAK_URL) ; les autres
  # conteneurs joignent Keycloak par http://keycloak:8080 (backchannel dynamique).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    container_name: swann_keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      databases:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-swann}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-swann}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      KC_HOSTNAME: ${KEYCLOAK_URL:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Valeurs injectées dans keycloak/import/swann-realm.json
      SWANN_READER_URL: ${READER_URL:-http://localhost:3000}
      SWANN_READER_CLIENT_SECRET: ${READER_CLIENT_SECRET:-dev-reader-secret}
      SWANN_CONSOLE_URL: ${CONSOLE_URL:-http://localhost:3001}
      SWANN_CONSOLE_CLIENT_SECRET: ${CONSOLE_CLIENT_SECRET:-dev-console-secret}
      SWANN_DEV_USER_PASSWORD: ${KEYCLOAK_DEV_USER_PASSWORD:-lecteur}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      # Thème de connexion « swann » (couleurs de la liseuse)
      - ./keycloak/themes/swann:/opt/keycloak/themes/swann:ro
    healthcheck:
      # Pas de curl dans l'image : requête HTTP à la main sur le port de gestion
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: swann_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"   # REST API
      - "${QDRANT_GRPC_PORT:-6334}:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Stockage S3 des EPUB (Garage, un seul nœud ; MinIO ne publie plus d'images).
  # Au premier démarrage, Garage crée lui-même son plan de nœud, la clé d'accès
  # S3_ACCESS_KEY / S3_SECRET_KEY et le bucket des livres ; `buckets` ajoute la boîte
  # de dépôt. Formats imposés par Garage : clé `GK` + 24 hexa, secrets de 64 hexa.
  # Pas de valeur par défaut : ces trois variables sont exigées (voir .env.example).
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: swann_garage
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set in .env}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      GARAGE_DEFAULT_BUCKET: ${MINIO_BOOKS_BUCKET:-books}
    ports:
      - "${S3_PORT:-3900}:3900"   # API S3
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Crée les buckets manquants (livres, boîte de dépôt de la console) avec le code
  # de swann, puis s'arrête. Même image que l'API.
  buckets:
    build:
      context: .
      dockerfile: corpus-api/Dockerfile
    image: swann-api
    container_name: swann_buckets
    depends_on:
      garage:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://garage:3900
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
      MINIO_BOOKS_BUCKET: ${MINIO_BOOKS_BUCKET:-books}
      MINIO_INBOX_BUCKET: ${MINIO_INBOX_BUCKET:-inbox}
    command:
      - python
      - -c
      - |
        import os
        from swann_core import s3
        mc = s3.client(os.environ["MINIO_ENDPOINT"], os.environ["MINIO_ROOT_USER"], os.environ["MINIO_ROOT_PASSWORD"])
        for bucket in (os.environ["MINIO_BOOKS_BUCKET"], os.environ["MINIO_INBOX_BUCKET"]):
            s3.ensure_bucket(mc, bucket)
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: swann_pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@swann.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Préconfigure la connexion au serveur "Swann" (mot de passe à saisir
      # une fois dans l'UI, non stocké en clair dans ce dépôt).
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

  # Pipeline d'ingestion (commande à la demande, pas un service permanent) :
  #   docker compose run --rm ingest check
  #   docker compose run --rm ingest extract
  # Avec le GPU (NVIDIA Container Toolkit requis côté hôte) :
  #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml run --rm ingest index run <collection>
  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    image: swann-ingest
    profiles: ["ingest"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      buckets:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-swann}:${POSTGRES_PASSWORD:-swann}@postgres:5432/${POSTGRES_DB:-swann}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      VECTOR_SIZE: ${VECTOR_SIZE:-1024}
      ALIGN_MODEL: ${ALIGN_MODEL:-sentence-transformers/LaBSE}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-32}
      MINIO_ENDPOINT: http://garage:3900
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
      MINIO_BOOKS_BUCKET: ${MINIO_BOOKS_BUCKET:-books}
    volumes:
      - ./books:/books:ro
      # Modèles Hugging Face téléchargés une seule fois
      - hf_cache:/cache/huggingface

  # Worker de la console d'administration (docs/console.md §3) : exécute la
  # file `jobs` (dépôts, retraitements, alignements, corbeille). Permanent,
  # garde les modèles en mémoire. Sur CPU par défaut ; GPU (conseillé) :
  # -f docker-compose.gpu.yml.
  ingest-worker:
    image: swann-ingest
    restart: unless-stopped
    command: ["worker"]
    stop_grace_period: 2m
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      buckets:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-swann}:${POSTGRES_PASSWORD:-swann}@postgres:5432/${POSTGRES_DB:-swann}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      VECTOR_SIZE: ${VECTOR_SIZE:-1024}
      ALIGN_MODEL: ${ALIGN_MODEL:-sentence-transformers/LaBSE}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-32}
      MINIO_ENDPOINT: http://garage:3900
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
      MINIO_BOOKS_BUCKET: ${MINIO_BOOKS_BUCKET:-books}
      MINIO_INBOX_BUCKET: ${MINIO_INBOX_BUCKET:-inbox}
      TRASH_DAYS: ${TRASH_DAYS:-30}
      IDENTIFY_AUTO: ${IDENTIFY_AUTO:-false}
      WIKIDATA_ENABLED: ${WIKIDATA_ENABLED:-true}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./books:/books:ro
      - hf_cache:/cache/huggingface

  # Corpus API (lecture du corpus pour les applications) → http://localhost:8000/v1/docs
  # Sur CPU par défaut ; GPU : ajouter -f docker-compose.gpu.yml (voir ce fichier).
  api:
    build:
      context: .
      dockerfile: corpus-api/Dockerfile
    image: swann-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      buckets:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-swann}:${POSTGRES_PASSWORD:-swann}@postgres:5432/${POSTGRES_DB:-swann}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks}
      MINIO_ENDPOINT: http://garage:3900
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
      MINIO_BOOKS_BUCKET: ${MINIO_BOOKS_BUCKET:-books}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/swann}
      # localhost:8080 n'existe pas dans le conteneur : clés lues par le réseau interne
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/swann
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-corpus-api}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      API_DEVICE: ${API_DEVICE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      # Mêmes modèles que l'ingestion, téléchargés une seule fois
      - hf_cache:/cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 3

  # Liseuse (Next.js) → http://localhost:3000
  # Migrations de la base `reader` appliquées au démarrage du conteneur.
  reader:
    build:
      context: ./reader
    image: swann-reader
    restart: unless-stopped
    depends_on:
      databases:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "${READER_PORT:-3000}:3000"
    environment: &reader-env
      BETTER_AUTH_URL: ${READER_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${READER_AUTH_SECRET:-dev-secret-change-me-dev-secret-change-me}
      READER_DATABASE_URL: postgresql://${POSTGRES_USER:-swann}:${POSTGRES_PASSWORD:-swann}@postgres:5432/reader
      # Émetteur public des jetons ; configuration OpenID lue par le réseau interne
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/swann}
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/swann
      READER_CLIENT_ID: swann-reader
      READER_CLIENT_SECRET: ${READER_CLIENT_SECRET:-dev-reader-secret}
      CORPUS_API_URL: ${CORPUS_API_URL:-http://api:8000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/manifest.webmanifest"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Suit /v1/changes : recale les progressions quand un texte est remplacé
  reader-worker:
    image: swann-reader
    restart: unless-stopped
    depends_on:
      reader:
        condition: service_healthy
    environment:
      <<: *reader-env
      WORKER_INTERVAL: ${READER_WORKER_INTERVAL:-60}
    command: ["node", "worker.mjs"]

  # Console d'administration (docs/console.md) → http://localhost:3001
  # Réservée aux rôles corpus:admin / corpus:review (client Keycloak swann-console).
  console:
    build:
      context: ./console
    image: swann-console
    restart: unless-stopped
    depends_on:
      databases:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "${CONSOLE_PORT:-3001}:3001"
    environment:
      BETTER_AUTH_URL: ${CONSOLE_URL:-http://localhost:3001}
      BETTER_AUTH_SECRET: ${CONSOLE_AUTH_SECRET:-dev-console-secret-change-me-dev-console}
      CONSOLE_DATABASE_URL: postgresql://${POSTGRES_USER:-swann}:${POSTGRES_PASSWORD:-swann}@postgres:5432/console
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/swann}
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/swann
      CONSOLE_CLIENT_ID: swann-console
      CONSOLE_CLIENT_SECRET: ${CONSOLE_CLIENT_SECRET:-dev-console-secret}
      CORPUS_API_URL: ${CORPUS_API_URL:-http://api:8000}
      READER_URL: ${READER_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/icon.svg"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres_data:
  qdrant_data:
  pgadmin_data:
  garage_meta:
  garage_data:
  hf_cache:
