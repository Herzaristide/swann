[project]
name = "swann-ingest"
version = "0.1.0"
description = "Pipeline d'ingestion de Swann : EPUB -> Postgres -> Qdrant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lxml>=5.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
    "psycopg[binary]>=3.2",
    "lingua-language-detector>=2.0",
    "swann-core",
]

[project.scripts]
swann = "swann_ingest.cli:app"

[tool.uv.sources]
swann-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swann_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
